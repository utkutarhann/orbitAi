<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Orbit Eats</title>
<link rel="stylesheet" href="styles.css?v=304000" />
<!-- Vercel Analytics & Speed Insights -->
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <svg style="display:none">
    <symbol id="icon-bowl" viewBox="0 0 48 48">
      <path d="M8 24c0 10 7 16 16 16s16-6 16-16H8z" fill="currentColor" opacity="0.95"/>
      <rect x="6" y="21" width="36" height="4" rx="2" fill="currentColor"/>
      <path d="M18 12c-1-3 0-6 2-7M24 10c-1-3 0-6 2-7M30 12c-1-3 0-6 2-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85"/>
    </symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24">
      <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <path d="M3 11l18-8-8 18-2.5-7.5L3 11z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-store" viewBox="0 0 48 48">
      <path d="M8 18l2-9h28l2 9" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
      <path d="M8 18a5 5 0 0010 0 5 5 0 0010 0 5 5 0 0010 0" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M11 22v16h26V22" stroke="currentColor" stroke-width="2.6" fill="none"/>
      <rect x="20" y="28" width="8" height="10" fill="currentColor" opacity="0.85"/>
    </symbol>
  </svg>

  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="app-shell">
        <div id="screen-root" class="screen-root"></div>
        <nav class="tabbar">
          <button data-tab="home" class="tab-btn active">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.2 12 3.5l9 6.7"/><path d="M5.5 9v10.5h13V9"/><path d="M9.8 19.5v-5.2h4.4v5.2"/>
              </svg>
            </span>
            <span class="tab-label">Ana Sayfa</span>
          </button>
          <button data-tab="orders" class="tab-btn">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8h12l-1 12.5H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M9.8 12.6h4.4"/>
              </svg>
            </span>
            <span class="tab-label">Siparişler</span>
          </button>
      <div class="eco-tab-slot">
        <div id="ecoFabGroup" class="eco-fab-group">
          <button id="ecoMart" class="eco-app-btn mart" aria-label="Orbit Mart'a geç" tabindex="-1">
            <span class="eco-ico">🛒</span>
            <span class="eco-name">Mart</span>
          </button>
          <button id="ecoPay" class="eco-app-btn pay" aria-label="Orbit Pay'e geç" tabindex="-1">
            <span class="eco-ico">💳</span>
            <span class="eco-name">Pay</span>
          </button>
          <button id="ecoSwitch" class="eco-fab" aria-label="Orbit ekosistemine geç" aria-expanded="false" title="Orbit ekosistemi">
            <svg class="eco-core" viewBox="0 0 44 44" fill="none">
              <ellipse cx="22" cy="22" rx="17" ry="6.5" transform="rotate(-24 22 22)" stroke="currentColor" stroke-width="2.3"/>
              <ellipse cx="22" cy="22" rx="17" ry="6.5" transform="rotate(38 22 22)" stroke="currentColor" stroke-width="2.3" opacity="0.55"/>
              <circle cx="22" cy="22" r="5" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
          <button data-tab="cart" class="tab-btn">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5h2.2l2 10.2h10l1.9-7.4H6.2"/><circle cx="9.2" cy="19" r="1.3"/><circle cx="16.4" cy="19" r="1.3"/>
              </svg>
              <span class="tab-badge" id="cartTabBadge" hidden></span>
            </span>
            <span class="tab-label">Sepetim</span>
          </button>
          <button data-tab="profile" class="tab-btn">
            <span class="tab-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.6" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/>
              </svg>
            </span>
            <span class="tab-label">Profil</span>
          </button>

        </nav>
      </div>
      <!-- AI'a giriş yalnızca arama çubuğundaki "Sor" ve moment kartları üzerinden;
           ayrı bir yüzen AI butonu bilinçli olarak yok. -->

    </div>
  </div>
  <script src="data.js?v=304000"></script>
  <script src="engine.js?v=304000"></script>
  <script src="app.js?v=304000"></script>
</body>
</html>
